[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cardshare"
version = "0.1.0"
description = "Share GPU cards between on-demand LLMs and background workloads, behind one OpenAI/Anthropic API"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "NektoDron"}]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
gateway = ["aiohttp>=3.9"]
test = ["aiohttp>=3.9", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/NektoDron/cardshare"

[project.scripts]
cardshare = "cardshare.cli:main"
cardshare-gateway = "cardshare.cli:gateway_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
